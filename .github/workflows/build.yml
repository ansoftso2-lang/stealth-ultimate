name: Build Stealth Ultimate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: android-ndk-r27b
          key: ndk-r27b-${{ runner.os }}

      - name: Install NDK r27b
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf android-ndk-r27b android-ndk-r27b-linux.zip
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          rm -f android-ndk-r27b-linux.zip
        timeout-minutes: 10

      - name: Build native libraries
        env:
          NDK_HOME: ${{ github.workspace }}/android-ndk-r27b
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27b
        run: |
          rm -f sources/zygisk/*.so
          bash sources/compile.sh
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "sources/zygisk/$abi.so" || {
              echo "Missing or empty sources/zygisk/$abi.so"
              exit 1
            }
          done
          ls -lh sources/zygisk/*.so

      - name: Assemble installable module
        run: |
          rm -rf build stealth_ultimate.zip
          mkdir -p build/zygisk build/common
          cp sources/zygisk/arm64-v8a.so build/zygisk/
          cp sources/zygisk/armeabi-v7a.so build/zygisk/
          cp sources/zygisk/x86.so build/zygisk/
          cp sources/zygisk/x86_64.so build/zygisk/
          python3 - <<'PY'
          from pathlib import Path
          source = Path('sources/module/module.prop').read_text(encoding='utf-8-sig')
          Path('build/module.prop').write_text(source.replace('\r\n', '\n'), encoding='utf-8', newline='\n')
          PY
          cp sources/shell/*.sh build/
          cp sources/shell/common/stealth.conf.default build/common/
          sed -i 's/\r$//' build/*.sh build/common/stealth.conf.default
          chmod 0755 build/*.sh
          chmod 0644 build/module.prop build/common/stealth.conf.default build/zygisk/*.so
          test "$(od -An -tx1 -N3 build/module.prop | tr -d ' \n')" != "efbbbf"
          (cd build && zip -q -r ../stealth_ultimate.zip .)

      - name: Validate installable ZIP
        run: |
          test -s stealth_ultimate.zip
          for file in \
            module.prop customize.sh post-fs-data.sh service.sh \
            zygisk/arm64-v8a.so zygisk/armeabi-v7a.so \
            zygisk/x86.so zygisk/x86_64.so; do
            unzip -Z1 stealth_ultimate.zip | grep -Fx "$file" >/dev/null || {
              echo "Missing from stealth_ultimate.zip: $file"
              exit 1
            }
          done
          unzip -t stealth_ultimate.zip
          unzip -l stealth_ultimate.zip

      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: stealth-ultimate
          path: stealth_ultimate.zip
          if-no-files-found: error
          retention-days: 30
